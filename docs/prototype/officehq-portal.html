<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OfficeHQ × Sunny — Media Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#FBFBFB; --panel:#FFFFFF; --line:#EBEBEB; --line-2:#DADADA;
  --ink:#0A0A0A; --muted:#585858; --faint:#8A8A8A;
  --gold:#FDB600; --gold-ink:#8A6300; --gold-soft:#FFF5DA;
  --grey-2:#585858; --grey-3:#9E9E9E; --grey-4:#C2C2C2; --grey-5:#E0E0E0;
  --good:#1E8A4C; --good-soft:#E6F4EC; --bad:#B4432F; --bad-soft:#FBEAE6; --warn:#9A6A00; --warn-soft:#FFF3D1;
  --radius:10px; --font:'Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A; --panel:#141414; --line:#262626; --line-2:#333;
    --ink:#F5F5F5; --muted:#A8A8A8; --faint:#7A7A7A;
    --gold-ink:#FDB600; --gold-soft:rgba(253,182,0,.12);
    --grey-2:#A8A8A8; --grey-3:#7A7A7A; --grey-4:#555; --grey-5:#333;
    --good:#4CC486; --good-soft:rgba(76,196,134,.12); --bad:#F08A73; --bad-soft:rgba(240,138,115,.12); --warn:#F5C451; --warn-soft:rgba(245,196,81,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --panel:#141414; --line:#262626; --line-2:#333;
  --ink:#F5F5F5; --muted:#A8A8A8; --faint:#7A7A7A;
  --gold-ink:#FDB600; --gold-soft:rgba(253,182,0,.12);
  --grey-2:#A8A8A8; --grey-3:#7A7A7A; --grey-4:#555; --grey-5:#333;
  --good:#4CC486; --good-soft:rgba(76,196,134,.12); --bad:#F08A73; --bad-soft:rgba(240,138,115,.12); --warn:#F5C451; --warn-soft:rgba(245,196,81,.12);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:22px 16px 18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.brand .mark{width:30px;height:30px;border-radius:50%;background:var(--gold);display:grid;place-items:center;flex:none}
.brand .mark span{width:12px;height:12px;border-radius:50%;background:var(--ink)}
.brand b{font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1.15;display:block}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.nav-group{margin-top:6px}
.nav-label{font-size:11px;color:var(--faint);padding:14px 10px 6px;font-weight:500}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:13.5px}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a.on{background:var(--gold-soft);color:var(--ink);font-weight:600}
.nav a .code{font-weight:800;font-size:11px;width:26px;height:20px;border-radius:5px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);color:var(--ink);flex:none}
.nav a.on .code{background:var(--gold);border-color:var(--gold);color:#0A0A0A}
.nav svg{width:17px;height:17px;flex:none}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line)}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.who b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.who small{color:var(--muted);font-size:11.5px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.topbar{display:none}
main{min-width:0;padding:34px 40px 60px;max-width:1280px;width:100%}

/* ---------- Type ---------- */
h1{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin:0}
h2{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0}
h3{font-size:14.5px;font-weight:600;margin:0}
.sub{color:var(--muted);margin:6px 0 0;max-width:68ch}
.meta{color:var(--faint);font-size:12px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Surfaces ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.mt{margin-top:16px}.mt2{margin-top:28px}

/* ---------- Hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hero-l{padding:28px 28px 26px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.hero-big{font-size:84px;font-weight:900;letter-spacing:-.05em;line-height:.95;color:var(--ink);margin:10px 0 6px}
.hero-big .unit{font-size:20px;font-weight:600;letter-spacing:-.01em;color:var(--muted);margin-left:8px}
.hero-l .rule{height:4px;width:56px;background:var(--gold);border-radius:2px;margin:18px 0 16px}
.hero-r{padding:22px 24px 16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;margin-top:auto}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right}

/* ---------- Market cards ---------- */
.mcard{display:flex;flex-direction:column;gap:14px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;transition:border-color .15s}
.mcard:hover{border-color:var(--ink)}
.mcard-top{display:flex;justify-content:space-between;align-items:flex-start}
.mcode{font-size:30px;font-weight:900;letter-spacing:-.04em;line-height:1}
.mname{font-size:12.5px;color:var(--muted);margin-top:3px}
.mstats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mstat small{display:block;color:var(--muted);font-size:11.5px}
.mstat b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.live{border-color:transparent;background:var(--good-soft);color:var(--good)}

/* ---------- Deltas / badges ---------- */
.delta{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;display:inline-block}
.delta.up{background:var(--good-soft);color:var(--good)}
.delta.down{background:var(--bad-soft);color:var(--bad)}
.delta.flat{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-live{background:var(--good-soft);color:var(--good)}
.st-paused{background:var(--warn-soft);color:var(--warn)}
.st-planned{background:var(--gold-soft);color:var(--gold-ink)}
.st-not_live,.st-awaiting{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

/* ---------- Links ---------- */
.qlinks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.qlink{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;background:var(--panel)}
a.qlink:hover{border-color:var(--ink)}
.qlink .ic{width:34px;height:34px;border-radius:8px;background:var(--gold-soft);display:grid;place-items:center;flex:none;color:var(--gold-ink)}
.qlink .ic svg{width:17px;height:17px}
.qlink b{display:block;font-weight:600;font-size:13.5px;line-height:1.3}
.qlink small{color:var(--muted);font-size:12px;line-height:1.4;display:block;margin-top:2px}
.qlink.unset{border-style:dashed;cursor:default}
.qlink.unset .ic{background:var(--bg);color:var(--faint)}

/* ---------- Feed ---------- */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:74px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0;padding-top:2px}
.feed .d{font-size:12px;color:var(--muted);font-weight:500}
.feed .t{font-size:13.5px}
.feed .tags{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.empty-cell{color:var(--faint)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:20px}
.tab{padding:10px 14px 11px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:500;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center;text-decoration:none}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--gold)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--grey-4)}
.tab .dot.live{background:var(--good)}
.tab.dim{opacity:.6}

/* ---------- Charts ---------- */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font);fill:var(--faint);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.ln{height:3px;border-radius:2px;width:14px}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.kpi{padding:16px 18px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}

/* ---------- Detail lists ---------- */
.dl{display:grid;grid-template-columns:150px 1fr;gap:0;margin:0}
.dl dt{color:var(--muted);font-size:12.5px;padding:10px 0;border-top:1px solid var(--line)}
.dl dd{margin:0;padding:10px 0;border-top:1px solid var(--line);white-space:pre-wrap;font-size:13.5px}
.dl dt:first-of-type,.dl dd:first-of-type{border-top:0}
.nodata{color:var(--faint);font-style:normal}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:var(--radius);background:var(--warn-soft);color:var(--ink);font-size:13px;border:1px solid transparent}
.note b{font-weight:600}
.note svg{flex:none;width:18px;height:18px;color:var(--warn);margin-top:2px}
.emptybox{border:1px dashed var(--line-2);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);font-size:13px}
.emptybox b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}

/* ---------- Creative ---------- */
.creative{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.cr{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--panel)}
.cr .stage{font-size:11.5px;color:var(--muted)}
.cr h3{margin:4px 0 6px}
.cr p{margin:0;font-size:13px;color:var(--muted)}

/* ---------- Forms ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0A0A0A}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:500;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);font-size:13.5px;color:var(--ink)}
textarea.inp{min-height:74px;resize:vertical;line-height:1.5}
.inp:focus{outline:none;border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
.admin-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.pill{padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-size:12.5px;font-weight:500;text-decoration:none;color:var(--muted)}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.edit-row{display:grid;grid-template-columns:1.1fr 2fr 1.6fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.edit-row:first-child{border-top:0}
.crow{border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px;grid-template-columns:repeat(4,minmax(0,1fr))}
.crow .full{grid-column:1/-1}
.crow .half{grid-column:span 2}
.checks{list-style:none;margin:0;padding:0}
.checks li{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;font-size:13px}
.checks li:first-child{border-top:0}
.checks .sev{flex:none;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;height:fit-content;margin-top:2px}
.sev.hi{background:var(--bad-soft);color:var(--bad)}
.sev.md{background:var(--warn-soft);color:var(--warn)}
.sev.lo{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.dropzone{border:1.5px dashed var(--line-2);border-radius:var(--radius);padding:26px;text-align:center;cursor:pointer;background:var(--bg)}
.dropzone:hover,.dropzone.over{border-color:var(--gold);background:var(--gold-soft)}

/* ---------- Team ---------- */
.clocks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.clock{padding:14px 16px;border-left:1px solid var(--line)}
.clock:first-child{border-left:0;background:var(--gold-soft)}
.clock small{display:block;font-size:11.5px;color:var(--muted)}
.clock b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.clock span{font-size:11.5px;color:var(--muted)}
.person{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.person .avatar{width:48px;height:48px;font-size:15px;background:var(--gold);color:#0A0A0A}
.person.placeholder{border-style:dashed}
.person.placeholder .avatar{background:var(--bg);color:var(--faint);border:1px dashed var(--line-2)}
.person h3{font-size:15px}
.person .role{color:var(--muted);font-size:12.5px}
.person .contact{display:grid;gap:3px;margin-top:10px;font-size:13px}
.person .contact a{text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line-2);width:fit-content}
.person .contact a:hover{border-color:var(--gold)}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:100%}
.login-l{background:#0A0A0A;color:#fff;padding:44px 48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-l h1{font-size:52px;font-weight:900;letter-spacing:-.04em;line-height:1.02;color:#fff;margin:0 0 16px;max-width:12ch}
.login-l p{color:#B8B8B8;max-width:44ch;margin:0}
.login-l .wave{position:absolute;inset:auto -80px -60px -80px;opacity:1;pointer-events:none}
.login-r{display:grid;place-items:center;padding:40px 24px;background:var(--bg)}
.login-form{width:100%;max-width:380px}
.login-form h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.err{color:var(--bad);font-size:12.5px;min-height:18px}
.demo{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.demo button{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.demo button:hover{border-color:var(--ink)}
.demo button b{color:var(--ink);font-weight:600}

.toast{max-width:calc(100vw - 32px);text-align:center;position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all .2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.proto{font-size:11.5px;color:var(--faint);margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qlinks{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-child(4){border-left:0}
  .kpi:nth-child(n+4){border-top:1px solid var(--line)}
  .hero{grid-template-columns:minmax(0,1fr)}.hero-l{border-right:0;border-bottom:1px solid var(--line)}
  .split{grid-template-columns:minmax(0,1fr)}
  .clocks{grid-template-columns:repeat(3,minmax(0,1fr))}
  .clock:nth-child(4){border-left:0}.clock:nth-child(n+4){border-top:1px solid var(--line)}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vw rgba(0,0,0,.35)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
  .topbar button{background:none;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;cursor:pointer}
  main{padding:22px 16px 48px}
  h1{font-size:27px}
  .hero-big{font-size:64px}
  .g2,.g3,.g4,.qlinks,.fgrid{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}

function fmtDate(d, opts={day:'numeric', month:'short'}){ if(!d) return ''; const [y,m,dd] = d.split('-').map(Number); return new Date(Date.UTC(y,m-1,dd)).toLocaleDateString('en-AU', {...opts, timeZone:'UTC'}); }

/* ---------------- Performance maths ---------------- */
// Ratios are ALWAYS recalculated from totals. Never sum weekly CTR/CPC/CR.
const P = () => S.perf;
function weeksWithData(){
  const W = P().weeks;
  return W.map((w,i) => ({...w, i})).filter(w => MARKETS.some(m => CHANNELS.some(c => (P().markets[m.id]?.[c.id]?.spend?.[w.i] || 0) > 0)));
}
function clicksAt(s, i){
  if (!s) return null;
  if (s.clicks?.[i] != null) return s.clicks[i];
  if (s.ctr?.[i] != null && s.impressions?.[i] != null) return Math.round(s.ctr[i] * s.impressions[i]); // derived
  return null;
}
function weekRow(mid, cid, i){
  const s = P().markets[mid]?.[cid]; if (!s) return null;
  const spend = s.spend?.[i] ?? null, imps = s.impressions?.[i] ?? null, clicks = clicksAt(s,i), leads = s.leads?.[i] ?? null;
  return {spend, imps, clicks, leads, derived: s.clicks?.[i] == null && clicks != null,
    ctr: clicks != null && imps ? clicks/imps : null, cpc: clicks ? (spend ?? 0)/clicks : null,
    cpl: leads ? (spend ?? 0)/leads : null, cvr: clicks && leads != null ? leads/clicks : null};
}
function agg(mid, cids, monthKey){
  const W = weeksWithData().filter(w => w.month === monthKey);
  let spend=0, imps=0, clicks=0, leads=0, n=W.length, clickWeeks=0;
  for (const w of W) for (const cid of cids){
    const r = weekRow(mid,cid,w.i); if (!r) continue;
    spend += r.spend || 0; imps += r.imps || 0; leads += r.leads || 0;
    if (r.clicks != null){ clicks += r.clicks; }
  }
  return {n, spend, imps, clicks, leads, spendW: n ? spend/n : null, leadsW: n ? leads/n : null,
    cpl: leads ? spend/leads : null, ctr: imps ? clicks/imps : null, cpc: clicks ? spend/clicks : null, cvr: clicks ? leads/clicks : null};
}
function months(){ const ms = [...new Set(weeksWithData().map(w => w.month))]; return {cur: ms[ms.length-1], prev: ms[ms.length-2], all: ms}; }
function liveChannels(mid){ return CHANNELS.filter(c => S.markets[mid].channels[c.id].status === 'live'); }
function perfChannels(mid){ return CHANNELS.filter(c => P().markets[mid]?.[c.id]?.spend?.some(v => v > 0)); }
function delta(cur, prev, lowerBetter, neutral){
  if (cur == null || prev == null || !isFinite(cur) || !isFinite(prev) || prev === 0) return '<span class="delta flat">new</span>';
  const d = (cur - prev) / prev;
  if (Math.abs(d) < 0.03) return `<span class="delta flat">flat</span>`;
  if (neutral) return `<span class="delta flat">${d > 0 ? '▲' : '▼'} ${Math.abs(d*100).toFixed(0)}%</span>`;
  const good = lowerBetter ? d < 0 : d > 0;
  return `<span class="delta ${good ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d*100).toFixed(0)}%</span>`;
}
function monthsNote(){
  const {cur, prev} = months();
  const nc = weeksWithData().filter(w => w.month === cur).length, np = weeksWithData().filter(w => w.month === prev).length;
  return `${monthName(cur,true)} to date (${nc} wk${nc>1?'s':''}) vs ${monthName(prev,true)} (${np} wks), weekly averages`;
}

/* ---------------- Charts (inline SVG) ---------------- */
function niceMax(v){ if (!(v > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1,2,4,6,8,10]) if (m*p >= v) return m*p; return 10*p; }
function chart({labels, bars=[], line=null, h=230, fmtL=short, fmtR=short, title='', w=720}){
  const W = w, H = h, pl = 44, pr = line ? 46 : 12, pt = 14, pb = 30;
  const pw = W - pl - pr, ph = H - pt - pb, n = labels.length, step = pw / n, bw = Math.min(46, step * 0.58);
  const sums = labels.map((_,i) => bars.reduce((a,b) => a + (b.values[i] || 0), 0));
  const maxY = niceMax(Math.max(...sums, 0));
  const maxL = line ? niceMax(Math.max(...line.values.filter(v => v != null), 0)) : 1;
  let g = '';
  for (let k = 0; k <= 4; k++){
    const y = pt + ph - ph * k/4;
    g += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${pl-8}" y="${y+4}" text-anchor="end">${fmtL(maxY*k/4)}</text>`;
    if (line) g += `<text x="${W-pr+8}" y="${y+4}">${fmtR(maxL*k/4)}</text>`;
  }
  labels.forEach((lab,i) => {
    const x = pl + step*i + (step-bw)/2; let yAcc = pt + ph;
    bars.forEach(b => {
      const v = b.values[i] || 0; if (!v) return;
      const bh = ph * v / maxY; yAcc -= bh;
      g += `<rect x="${x}" y="${yAcc}" width="${bw}" height="${Math.max(bh,0.5)}" fill="${b.hex}" rx="2"><title>${esc(lab)} · ${esc(b.name)}: ${esc(b.fmt ? b.fmt(v) : num(v,1))}</title></rect>`;
    });
    g += `<text x="${pl + step*i + step/2}" y="${H-10}" text-anchor="middle">${esc(lab)}</text>`;
  });
  if (line){
    const pts = line.values.map((v,i) => v == null ? null : [pl + step*i + step/2, pt + ph - ph * v / maxL]);
    let d = '', started = false;
    pts.forEach(p => { if (!p){ started = false; return; } d += (started ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); started = true; });
    g += `<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach((p,i) => { if (p) g += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"><title>${esc(labels[i])} · ${esc(line.name)}: ${esc(line.fmt ? line.fmt(line.values[i]) : num(line.values[i],1))}</title></circle>`; });
  }
  const legend = bars.map(b => `<span><i style="background:${b.hex}"></i>${esc(b.name)}</span>`).join('') + (line ? `<span><i class="ln" style="background:var(--ink)"></i>${esc(line.name)} (right axis)</span>` : '');
  return `<div class="chart" role="img" aria-label="${esc(title)}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg></div><div class="legend">${legend}</div>`;
}
function spark(values, w=120, h=34){
  const v = values.map(x => x ?? 0), max = Math.max(...v, 1), n = v.length;
  const pts = v.map((y,i) => `${(i*(w-4)/(n-1)+2).toFixed(1)},${(h-3 - (h-6)*y/max).toFixed(1)}`);
  const last = pts[pts.length-1].split(',');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--gold)"/></svg>`;
}

  const totals = labels.map((_,i) => series.reduce((a,s) => a + s.values[i], 0));
  const lastW = W[W.length-1], lastTotal = totals[totals.length-1];

  const mSum = (mk, key, cids=allC) => MARKETS.reduce((a,m) => a + agg(m.id, cids, mk)[key], 0);
  const nCur = W.filter(w => w.month === cur).length, nPrev = W.filter(w => w.month === prev).length;

const greeting = () => { const h = new Date().getHours(); return h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening'; };
const firstName = n => (n || '').split(' ')[0] || 'there';

function marketCard(m, cur, prev){
  const cids = CHANNELS.map(c => c.id), a = agg(m.id, cids, cur), b = agg(m.id, cids, prev);
  const W = weeksWithData(), wkLeads = W.map(w => CHANNELS.reduce((s,c) => s + (P().markets[m.id]?.[c.id]?.leads?.[w.i] || 0), 0));
  const live = liveChannels(m.id);
  return `<a class="mcard" href="#/market/${m.id}">
    <div class="mcard-top"><div><div class="mcode">${m.code}</div><div class="mname">${esc(m.name)} · ${m.currency}</div></div>${spark(wkLeads)}</div>
    <div class="mstats">
      <div class="mstat"><small>Leads / week</small><b class="num">${num(a.leadsW,1)}</b><br>${delta(a.leadsW, b.leadsW)}</div>
      <div class="mstat"><small>Cost per lead</small><b class="num">${money(a.cpl, m.currency)}</b><br>${delta(a.cpl, b.cpl, true)}</div>
    </div>
    <div class="chips">${live.length ? live.map(c => `<span class="chip live">${esc(c.name)}</span>`).join('') : '<span class="chip">No live channels</span>'}</div>
  </a>`;
}
function linkTile(l){
  const inner = `<div class="ic">${ICON[l.icon] || ICON.link}</div><div><b>${esc(l.label)}</b><small>${l.url ? esc(l.desc) : 'Link not added yet'}</small></div>`;
  return l.url ? `<a class="qlink" href="${esc(l.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="qlink unset">${inner}</div>`;
}
function momTable(cur, prev){
  let rows = '';
  for (const m of MARKETS) for (const c of perfChannels(m.id)){
    const a = agg(m.id,[c.id],cur), b = agg(m.id,[c.id],prev);
    rows += `<tr><td><b style="font-weight:700">${m.code}</b> ${esc(c.name)}</td>
      <td class="r num">${money(a.spendW,m.currency)} ${delta(a.spendW,b.spendW,false,true)}</td>
      <td class="r num">${num(a.leadsW,1)} ${delta(a.leadsW,b.leadsW)}</td>
      <td class="r num">${money(a.cpl,m.currency)} ${delta(a.cpl,b.cpl,true)}</td></tr>`;
  }
  return `<div class="tbl-wrap"><table><thead><tr><th>Market & channel</th><th class="r">Spend / wk</th><th class="r">Leads / wk</th><th class="r">Cost per lead</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="meta" style="margin:10px 0 0">${esc(monthsNote())}. Green means better: more leads or a lower cost per lead. Spend changes are shown in grey.</p>`;
}
function feedHTML(items){
  if (!items.length) return `<div class="emptybox"><b>No updates yet</b>Changes to creative, budgets and targeting will show here.</div>`;
  return `<ul class="feed">${items.map(c => `<li><div class="d">${fmtDate(c.date)}</div><div><div class="t">${esc(c.text)}</div><div class="tags"><span class="chip">${esc(c.type)}</span><span class="chip">${c.market === 'all' ? 'All markets' : esc(MARKETS.find(m => m.id === c.market)?.code || '')}</span>${c.channel && c.channel !== 'all' ? `<span class="chip">${esc(CHANNELS.find(x => x.id === c.channel)?.name || '')}</span>` : ''}</div></div></li>`).join('')}</ul>`;
}
function pacingHTML(bud, spd){
  const ms = Object.keys(bud).sort();
  return ms.map(mk => {
    const b = bud[mk] || 0, s = spd[mk] || 0;
    if (!b && !s) return `<div style="padding:10px 0;border-top:1px solid var(--line)" class="row"><b style="width:44px;font-weight:600">${monthName(mk)}</b><span class="meta">Not entered in the media report yet</span></div>`;
    const p = b ? s/b : null;
    return `<div style="padding:10px 0 12px">
      <div class="row" style="justify-content:space-between"><b style="font-weight:600">${monthName(mk,true)}</b><span class="num"><b style="font-weight:700">${money(s,'AUD')}</b> <span class="meta">of ${money(b,'AUD')}</span></span></div>
      <div style="height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--line);margin-top:8px;overflow:hidden"><div style="height:100%;width:${Math.min(100,(p||0)*100)}%;background:var(--gold)"></div></div>
      <div class="meta" style="margin-top:6px">${pct(p,0)} of budget spent</div></div>`;
  }).join('') + `<p class="meta" style="margin:4px 0 0">Covers OHQ, RHQ ×3, ANS & LexHelper.</p>`;
}

/* ---------------- Market ---------------- */

    const tz = el.dataset.tz, now = new Date();
    el.querySelector('b').textContent = new Intl.DateTimeFormat('en-AU',{timeZone:tz,hour:'numeric',minute:'2-digit'}).format(now);
    el.querySelector('span').textContent = new Intl.DateTimeFormat('en-AU',{timeZone:tz,weekday:'long'}).format(now);
    if (tz === 'Australia/Brisbane'){
      const parts = new Intl.DateTimeFormat('en-AU',{timeZone:tz,hour:'numeric',minute:'numeric',weekday:'short',hour12:false}).formatToParts(now);
      const h = +parts.find(p => p.type==='hour').value, mi = +parts.find(p => p.type==='minute').value, wd = parts.find(p => p.type==='weekday').value;
      const on = !['Sat','Sun'].includes(wd) && (h*60+mi) >= 510 && (h*60+mi) < 1020;
      el.querySelector('span').textContent = on ? 'Online now' : 'Outside hours';
    }
  });
  upd(); clearInterval(tickClocks._i); tickClocks._i = setInterval(() => { if (!document.getElementById('clocks')) return clearInterval(tickClocks._i); upd(); }, 30000);
}

  const top = S.perf.topline || {};
  const emptyTop = Object.entries(top).filter(([k,v]) => !Object.values(v).some(x => x)).map(([k]) => k);
  if (emptyTop.length) items.push(['md', `Topline rows with no values yet: ${emptyTop.join(', ')}.`]);
  const {cur} = months(), bud = top['Monthly Marketing Budget (AUD)'] || {};
  if (!bud[cur]) items.push(['md', `${monthName(cur,true)} budget and spend aren't entered in the topline section yet.`]);
  const gaps = [];
  for (const m of MARKETS) for (const c of CHANNELS){
    const s = P().markets[m.id]?.[c.id]; if (!s) continue;

  }
  if (gaps.length) items.push(['md', `Blank cells with spend in the same week (${gaps.length}): ${gaps.join('; ')}. Clicks are estimated from CTR × impressions where possible.`]);
  const orgEmpty = MARKETS.every(m => !(P().markets[m.id]?.organic?.sessions || []).some(v => v));

  return `<ul class="checks">${items.map(([s,t]) => `<li><span class="sev ${s}">${s==='hi'?'Fix':s==='md'?'Check':'Note'}</span><span>${esc(t)}</span></li>`).join('')}</ul>`;

/* ---------------- Workbook import ---------------- */
function parseWorkbook(wb){
  const ws = wb.Sheets['Master Report'];
  if (!ws) throw new Error('No "Master Report" tab found in that file.');
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
  const r1 = rows[0] || [], r2 = rows[1] || [], r3 = rows[2] || [];
  const pad = n => String(n).padStart(2,'0');
  const serial = v => { const d = new Date(Math.round((v - 25569) * 864e5)); return {y:d.getUTCFullYear(), m:d.getUTCMonth()+1}; };
  let month = null; const weeks = [], totals = {};
  for (let c = 2; c < Math.max(r1.length, r2.length); c++){
    if (typeof r1[c] === 'number' && r1[c] > 30000) month = serial(r1[c]);
    const lab = r2[c];
    if (month && typeof lab === 'string' && /^W\d/.test(lab) && r3[c] != null) weeks.push({col:c, date:`${month.y}-${pad(month.m)}-${pad(Number(r3[c]))}`, label:lab, month:`${month.y}-${pad(month.m)}`});
    if (month && lab === 'Monthly Total') totals[`${month.y}-${pad(month.m)}`] = c;
  }
  if (!weeks.length) throw new Error('Couldn\'t find the week columns (W1, W2…) in rows 1–3.');
  const MK = {'OFFICEHQ - AU':'au','RECEPTIONHQ - US':'us','RECEPTIONHQ - UK':'uk','RECEPTIONHQ - NZ':'nz'};
  const CH = {'Paid Search':'google','Organic Search & Generative AI (combined)':'organic','Paid LinkedIn':'linkedin','Paid Meta':'meta','Paid ChatGPT':'chatgpt','Programatic':'programmatic','Programmatic':'programmatic','Paid Microsoft':'microsoft','Microsoft':'microsoft'};
  const MET = {'Spend':'spend','Impressions':'impressions','Clicks':'clicks','CTR':'ctr','CPC':'cpc','Leads':'leads','Conversion Rate (%)':'cr'};
  const markets = {}, topline = {}; let market = null, chan = null;
  for (let r = 4; r < rows.length; r++){
    const a = rows[r][0], b = rows[r][1];
    if (typeof a === 'string'){
      const hit = Object.keys(MK).find(k => a.trim().toUpperCase().startsWith(k));
      if (hit){ market = MK[hit]; markets[market] = {}; chan = null; continue; }
      if (CH[a.trim()]) chan = CH[a.trim()];
    }
    if (!b || typeof b !== 'string') continue;
    if (!market){ topline[b] = Object.fromEntries(Object.entries(totals).map(([mk,c]) => [mk, rows[r][c] ?? 0])); continue; }
    const key = MET[b.trim()] || (b.startsWith('Sessions') ? 'sessions' : b.startsWith('Leads') ? 'leads' : b.startsWith('Conv') ? 'cr' : null);
    if (!chan || !key) continue;
    markets[market][chan] = markets[market][chan] || {};
    markets[market][chan][key] = weeks.map(w => { const v = rows[r][w.col]; return typeof v === 'number' ? v : null; });
  }
  if (!Object.keys(markets).length) throw new Error('Couldn\'t find the market sections (e.g. "OFFICEHQ - AU").');
  return {weeks: weeks.map(({date,label,month}) => ({date,label,month})), markets, topline};
}
function importFile(file){
  const rd = new FileReader();
  rd.onload = e => {
    try {
      if (typeof XLSX === 'undefined') throw new Error('The spreadsheet reader didn\'t load. Check your connection and try again.');
      const perf = parseWorkbook(XLSX.read(new Uint8Array(e.target.result), {type:'array'}));
      S.perf = perf; S.perfSource = file.name; S.updated.performance = today();
      for (const m of MARKETS) for (const c of CHANNELS){ const has = perf.markets[m.id]?.[c.id]?.spend?.some(v => v > 0); const ch = S.markets[m.id].channels[c.id]; if (has && ch.status === 'not_live') ch.status = 'live'; }
      save(`Imported ${weeksWithData().length} weeks from ${file.name}`); render();
    } catch(err){ toast(err.message); }
  };
  rd.readAsArrayBuffer(file);
}

});
document.addEventListener('dragover', e => { const dz = e.target.closest?.('#dz'); if (dz){ e.preventDefault(); dz.classList.add('over'); } });
document.addEventListener('dragleave', e => { e.target.closest?.('#dz')?.classList.remove('over'); });
document.addEventListener('drop', e => { const dz = e.target.closest?.('#dz'); if (dz){ e.preventDefault(); dz.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) importFile(f); } });
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
